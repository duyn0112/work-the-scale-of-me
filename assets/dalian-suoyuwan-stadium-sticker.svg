  <title id="stadium-title">大连梭鱼湾足球场</title>
  <desc id="stadium-desc">按参考照片绘制的梭鱼湾球场正面外观。蓝色斜纹幕墙包裹上下两层椭圆形场馆，白色环带分隔两层，基座包含入口和台阶。两端宽度按 300 米标定。</desc>
