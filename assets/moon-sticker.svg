<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="moonTitle moonDesc" data-real-diameter-km="3474.8" data-globe-diameter="148">
  <title id="moonTitle">Sticker Moon</title>
  <desc id="moonDesc">Cartoon sticker-style Moon with a cream outline, flat craters and halftone shading. Drawn separately from Earth at the same 74 percent globe-to-canvas ratio.</desc>
  <defs>
    <clipPath id="moonClip"><circle cx="100" cy="100" r="74"/></clipPath>
    <pattern id="moonHalftone" width="6" height="6" patternUnits="userSpaceOnUse">
      <circle cx="1.8" cy="1.8" r="1.3" fill="#04121a"/>
    </pattern>
    <mask id="moonShade">
      <rect width="200" height="200" fill="#fff"/>
      <circle cx="88" cy="86" r="74" fill="#000"/>
    </mask>
    <filter id="moonShadow" x="-35%" y="-35%" width="170%" height="170%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <circle cx="104" cy="106" r="79" fill="#000" opacity=".45" filter="url(#moonShadow)"/>
  <circle cx="100" cy="100" r="74" fill="#e7dfcc" stroke="#f1eee7" stroke-width="5"/>

  <g clip-path="url(#moonClip)">
    <g id="craters">
      <circle cx="122" cy="114" r="17" fill="#d2c5ae"/>
      <circle cx="125" cy="118" r="9.5" fill="#c0b29a" opacity=".45"/>

      <circle cx="74" cy="72" r="13" fill="#d2c5ae"/>
      <circle cx="76" cy="74" r="7" fill="#c0b29a" opacity=".42"/>

      <circle cx="116" cy="64" r="7.5" fill="#d2c5ae"/>
      <circle cx="64" cy="116" r="9" fill="#d2c5ae"/>
      <circle cx="66" cy="118" r="5" fill="#c0b29a" opacity=".4"/>
      <circle cx="98" cy="146" r="6" fill="#d2c5ae"/>
      <circle cx="56" cy="92" r="5" fill="#d2c5ae"/>
      <circle cx="140" cy="84" r="5.5" fill="#d2c5ae"/>
      <circle cx="142" cy="142" r="4.5" fill="#d2c5ae"/>
    </g>

    <circle cx="100" cy="100" r="74" fill="url(#moonHalftone)" opacity=".22" mask="url(#moonShade)"/>
  </g>

  <circle cx="100" cy="100" r="74" fill="none" stroke="#f1eee7" stroke-width="5"/>
</svg>
