<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 400" width="400" height="400" role="img" aria-labelledby="pltTitle pltDesc" data-real-diameter-um="2.5" data-subject-diameter="250">
  <title id="pltTitle">Platelet sticker</title>
  <desc id="pltDesc">Sticker-comic platelet fragment with a pale lavender body, purple granules and a cream outline.</desc>
  <defs>
    <path id="cut" d="M200 56 C238 54 268 72 286 100 C304 128 318 152 312 180 C324 206 308 234 284 246 C276 276 246 294 218 286 C196 306 162 298 150 274 C122 272 102 248 106 222 C86 206 84 176 102 158 C100 132 120 108 146 102 C160 74 178 60 200 56 Z"/>
