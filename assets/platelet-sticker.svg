    <pattern id="dots" width="7" height="7" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#04121a"/></pattern>
    <mask id="shade"><rect width="400" height="400" fill="#fff"/><circle cx="140" cy="120" r="320" fill="#000"/></mask>
