      <circle cx="160" cy="150" r="7"/><circle cx="204" cy="132" r="5"/><circle cx="240" cy="170" r="8"/>
      <circle cx="190" cy="204" r="6"/><circle cx="148" cy="206" r="5"/><circle cx="224" cy="228" r="5.5"/>
      <circle cx="250" cy="204" r="3.5"/><circle cx="132" cy="172" r="3.5"/>
    </g>
    <g fill="#a797ba">
      <circle cx="176" cy="236" r="3.5"/><circle cx="270" cy="188" r="3"/><circle cx="214" cy="248" r="3"/>
